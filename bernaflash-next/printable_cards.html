<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Öğrenci Şifre Kartları</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .no-print {
                display: none;
            }
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 210mm;
            /* A4 width */
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 2px dashed #ccc;
            padding: 20px;
            page-break-inside: avoid;
            text-align: center;
            border-radius: 8px;
        }

        .school-name {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-class {
            font-size: 16px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .student-name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #111;
        }

        .credentials {
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: inline-block;
            width: 90%;
            border: 1px solid #e2e8f0;
        }

        .cred-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 16px;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            color: #0f172a;
        }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 15px;
            background: #4f46e5;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .page-break {
            page-break-after: always;
        }
    </style>
</head>
